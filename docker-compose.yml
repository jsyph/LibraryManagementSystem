services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: library-mssql
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_SA_PASSWORD=Library@Passw0rd2026
    ports:
      - "1433:1433"
    restart: unless-stopped
    volumes:
      - mssql-data:/var/opt/mssql

volumes:
  mssql-data:
